<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        /* Reset default styles for consistency */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1d2b64, #f8cdda); /* Neon effect */
            color: #ffffff;
            line-height: 1.6;
            padding: 50px 15px;
            overflow-x: hidden;
            background-attachment: fixed; /* Parallax effect */
        }

        /* Header Styling */
        header {
            background: rgba(34, 34, 34, 0.85); /* Semi-transparent dark */
            color: #f0f0f0;
            padding: 30px 50px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        header:hover {
            background: rgba(34, 34, 34, 0.95); /* Slightly darker on hover */
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            word-wrap: break-word;
            text-shadow: 0px 4px 12px rgba(255, 255, 255, 0.2); /* Glowing text effect */
            color: #f39c12; /* Bright yellow color */
        }

        header nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.4rem;
            font-weight: 600;
            margin-top: 20px;
        }

        header nav ul li {
            display: inline;
        }

        header nav ul li a {
            color: #fff;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff4081, #ff7043);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }

        /* Section Styling */
        section.contact-container {
            padding: 50px 40px;
            max-width: 900px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        section.contact-container:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transform: translateY(-10px);
        }

        h2 {
            font-size: 3rem;
            color: #f39c12;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        form input, form textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        form input:focus, form textarea:focus {
            border-color: #ff4081;
            box-shadow: 0 0 14px rgba(255, 99, 71, 0.4);
            outline: none;
        }

        form label {
            font-size: 1.2rem;
            color: #f0f0f0;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: left;
        }

        /* Button Styling */
        form .btn {
            background: linear-gradient(135deg, #ff4081, #ff7043);
            color: #fff;
            font-size: 1.5rem;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.2s ease;
        }

        form .btn:hover {
            transform: translateY(-6px);
            background-color: #ff5722;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        form .btn:active {
            transform: translateY(2px);
            background-color: #ff4081;
        }

        /* Footer Styles */
        footer {
            background: rgba(0, 0, 0, 0.7);
            color: #f0f0f0;
            padding: 25px 0;
            text-align: center;
            font-size: 1.4rem;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        footer p {
            margin: 0;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Media Queries for Responsiveness */
        @media screen and (max-width: 768px) {
            header h1 {
                font-size: 2.5rem;
            }

            header nav ul {
                flex-direction: column;
                gap: 20px;
            }

            section.contact-container {
                padding: 30px;
                margin: 20px 10px;
            }

            form {
                gap: 18px;
            }

            form .btn {
                width: 100%;
                padding: 18px;
            }

            footer {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Booking Slot for Parking </h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li> 
                <li><a href="register.html">Register</a></li>
                <li><a href="booking.html">Book a Slot</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-container">
        <h2>Contact Us</h2>
        <p>Feel free to reach out to us if you have any questions or need assistance.</p>
        <form action="your-backend-script.php" method="POST">
            <label for="contactName">Name:</label>
            <input type="text" id="contactName" name="name" required>

            <label for="contactEmail">Email:</label>
            <input type="email" id="contactEmail" name="email" required>

            <label for="contactMessage">Message:</label>
            <textarea id="contactMessage" name="message" rows="4" required></textarea>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Booking Slot for Car Parking Website</p>
    </footer>
</body>
</html>
