<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your CSS file -->
    <script>
        // JavaScript for form validation (optional)
        function validateLoginForm() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            // Check if all fields are filled out
            if (email === "" || password === "") {
                alert("Please fill in all fields.");
                return false; // Prevent form submission
            }

            // If everything is valid, submit the form
            return true;
        }
    </script>
</head>
<body>
    <header>
        <h1>Booking Slot for Parking </h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="booking.html">Book a Slot</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="form-container">
        <h2>Login</h2>

        <!-- The form posts to login.php -->
        <form id="loginForm" action="login.php" method="POST" onsubmit="return validateLoginForm()">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn">Login</button>
        </form>

        <!-- Optional: Display error or success message -->
        <p>Don't have an account? <a href="register.html">Register here</a>.</p>
    </section>

    <footer>
        <p>&copy; 2025 Booking Slot for Parking Website</p>
    </footer>
</body>
</html>
